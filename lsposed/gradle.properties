org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# compileSdk 37 is needed by material3 1.5.0-alpha22; AGP 9.1.0 still flags it as
# "above max recommended (36)". The combo builds fine — silence the warning.
android.suppressUnsupportedCompileSdk=37

# Reuse task outputs across builds when inputs match. Combined with
# gradle/actions/setup-gradle in CI, repeat builds of the same code go
# UP-TO-DATE on most tasks instead of executing again.
org.gradle.caching=true

# Skip the configuration phase entirely when nothing in the build files
# has changed. Verified compatible with the current AGP 9.2.1 + Kotlin
# 2.4.0 toolchain (`./gradlew :app:assembleDebug --configuration-cache`
# reports "Configuration cache entry stored" without warnings).
org.gradle.configuration-cache=true
