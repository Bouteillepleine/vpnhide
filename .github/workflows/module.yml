# Fork-only workflow. Upstream's `ci.yml` already builds every backend, but it
# runs each build inside `ghcr.io/<this repo>/ci:latest` — an image published by
# `ci-image.yml` under whichever account owns the repo. A fork therefore cannot
# run it until it has published its own copy of that image, and the rest of the
# pipeline is per-KMI QEMU gates a fork has no reason to repeat.
#
# This workflow does one job: produce the flashable kernel-module zip. It needs
# no secrets and no self-published images — the activator is built on a stock
# runner, and the module itself inside the public upstream DDK image.
name: Module

on:
  workflow_dispatch:
    inputs:
      kmi:
        description: 'GKI generation to build for (see: adb shell uname -r). "all" builds every one.'
        required: true
        type: choice
        default: android16-6.12
        options:
          - all
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
      publish_release:
        description: 'Also publish the zips as a release on this fork'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Tag for that release. Empty = module-v<VERSION>-<run number>'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      kmis: ${{ steps.plan.outputs.kmis }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: plan
        env:
          KMI_INPUT: ${{ inputs.kmi }}
          TAG_INPUT: ${{ inputs.release_tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          # The matrix comes from build.py's own GKI_VARIANTS instead of being
          # repeated here, so a rebase that adds or drops a generation upstream
          # can't leave this workflow building a stale set.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import ast, json, os, pathlib, sys

          src = pathlib.Path("kmod/build.py").read_text(encoding="utf-8")
          variants = None
          for node in ast.parse(src).body:
              if isinstance(node, ast.Assign) and any(
                  getattr(t, "id", None) == "GKI_VARIANTS" for t in node.targets
              ):
                  variants = list(ast.literal_eval(node.value))
                  break
          if not variants:
              sys.exit("GKI_VARIANTS not found in kmod/build.py")

          want = os.environ["KMI_INPUT"]
          if want == "all":
              kmis = variants
          elif want in variants:
              kmis = [want]
          else:
              sys.exit(f"kmod/build.py does not support KMI {want}; it supports {variants}")

          version = pathlib.Path("VERSION").read_text(encoding="utf-8").strip()
          tag = os.environ.get("TAG_INPUT") or f"module-v{version}-{os.environ['RUN_NUMBER']}"

          print(f"kmis={json.dumps(kmis)}")
          print(f"version={version}")
          print(f"tag={tag}")
          print(f"Building {kmis} for vpnhide {version}", file=sys.stderr)
          PY

  # The activator is the userspace half of the module: it turns the app's JSON
  # config into the backend wire format and insmods the .ko at boot. Built on a
  # stock runner (Rust + the preinstalled NDK) so this workflow needs nothing
  # the fork has to publish first.
  activator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Add Android target
        run: rustup target add aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            target
          key: cargo-${{ runner.os }}-module-activator-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-module-activator-

      - name: Install cargo-ndk
        run: |
          set -euo pipefail
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
          cargo ndk --version

      - name: Build kmod activator
        run: |
          set -euo pipefail
          # Runner-provided NDK paths are shell variables, not workflow env
          # context, so they have to be resolved here rather than in `env:`.
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-}}}"
          [ -n "$NDK" ] && [ -d "$NDK" ] || { echo "::error::No Android NDK on this runner"; exit 1; }
          export ANDROID_NDK_HOME="$NDK"
          echo "Using NDK: $NDK"
          # --locked for the same reason scripts/build_lib.py passes it: a
          # rewritten Cargo.lock dirties the tree and stamps every artifact
          # "X.Y.Z-dirty" via git describe --dirty.
          cargo ndk -t arm64-v8a build --release --locked -p vpnhide_activator --bin kmod

      - name: Check the binary is Android arm64
        run: |
          set -euo pipefail
          python3 - target/aarch64-linux-android/release/kmod <<'PY'
          import sys

          data = open(sys.argv[1], "rb").read()
          if data[:4] != b"\x7fELF":
              sys.exit("activator is not an ELF binary")
          machine = int.from_bytes(data[18:20], "little")
          if machine != 183:  # EM_AARCH64
              sys.exit(f"activator is not aarch64 (e_machine={machine})")
          print(f"activator ok: aarch64 ELF, {len(data)} bytes")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: module-activator
          path: target/aarch64-linux-android/release/kmod
          if-no-files-found: error

  kmod:
    needs: [plan, activator]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi: ${{ fromJSON(needs.plan.outputs.kmis) }}
    # Public upstream image — no credentials, nothing this fork must publish
    # first. The tag mirrors DDK_IMAGE_TAG in kmod/build.py; bump both together.
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260313
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/download-artifact@v7
        with:
          name: module-activator
          path: .artifacts/activator

      - name: Build and package module
        env:
          KMI: ${{ matrix.kmi }}
          VPNHIDE_KMOD_ACTIVATOR: ${{ github.workspace }}/.artifacts/activator/kmod
        run: python3 kmod/build.py --kmi "$KMI" --inside-container

      - name: Inspect the packaged module
        env:
          KMI: ${{ matrix.kmi }}
        run: |
          set -euo pipefail
          ZIP="vpnhide-kmod-${KMI}.zip"
          WORK="$(mktemp -d)"
          unzip -o -q "$ZIP" -d "$WORK"

          for f in vpnhide_kmod.ko activator module.prop post-fs-data.sh service.sh customize.sh; do
            [ -f "$WORK/$f" ] || { echo "::error::$ZIP is missing $f"; exit 1; }
          done

          # vermagic is reported for the flasher's benefit, not asserted: with
          # CONFIG_MODVERSIONS the kernel skips the release prefix and compares
          # only the trailing flags plus per-symbol CRCs, so a version string
          # that differs from the target kernel does not by itself mean the
          # module won't load.
          VM="$(tr -c '[:print:]' '\n' < "$WORK/vpnhide_kmod.ko" | sed -n 's/^vermagic=//p' | head -n1)"
          echo "vermagic: ${VM:-<unreadable>}"

          {
            echo "### ${KMI}"
            echo ""
            echo '| field | value |'
            echo '|---|---|'
            echo "| zip | \`${ZIP}\` |"
            echo "| size | $(du -h "$ZIP" | cut -f1) |"
            echo "| vermagic | \`${VM:-unreadable}\` |"
            echo "| sha256 | \`$(sha256sum "$ZIP" | cut -d' ' -f1)\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          echo "--- module.prop ---"
          cat "$WORK/module.prop"
          rm -rf "$WORK"

      - uses: actions/upload-artifact@v7
        with:
          name: vpnhide-kmod-${{ matrix.kmi }}
          path: vpnhide-kmod-${{ matrix.kmi }}.zip
          if-no-files-found: error

  release:
    needs: [plan, kmod]
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: vpnhide-kmod-*
          merge-multiple: true

      - name: Describe the release
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          ls -l dist/

          # The module carries no UI: targets are chosen in the app, which
          # writes the JSON the activator reads. Shipping the zip without
          # saying so produces a module that loads and appears to do nothing.
          cat > notes.md <<EOF
          Kernel-module builds of vpnhide **${VERSION}** from this fork.

          Flash the zip matching \`adb shell uname -r\`, reboot, then install the
          matching **v${VERSION}** app from
          [okhsunrog/vpnhide releases](https://github.com/okhsunrog/vpnhide/releases/tag/v${VERSION})
          and pick your targets there — the module hides nothing until it has a
          target list.

          Check it came up:

          \`\`\`
          adb shell "su -c 'lsmod | grep vpnhide'"
          adb shell "su -c 'dmesg | grep vpnhide'"
          \`\`\`

          \`insmod: Exec format error\` means this build's symbol CRCs don't match
          the running kernel — expected on a kernel that changed the KMI. Build
          the module against that kernel's own tree instead.
          EOF
          cat notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: ${{ needs.plan.outputs.tag }}
          body_path: notes.md
          draft: false
          prerelease: true
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
